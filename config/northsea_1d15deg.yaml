# Example configuration for a North Sea bathymetry run.
# Run with: bathymetry-regrid --config example_northsea.yaml
# Override individual settings on the command line, e.g.:
#   bathymetry-regrid --config example_northsea.yaml --smooth-rx0 0.15

# Short identifier used in all output file names:
#   output NetCDF  → northsea_0p05deg.nc
#   report dir     → ./report/northsea_0p05deg/
#   figures        → northsea_0p05deg_02_source_depth.png, etc.
name: northsea_1d15deg

source: /server/data/GEBCO/GEBCO_2023.nc

grid:
  type: spherical
  lon_min: -5.75
  lon_max: 13.25
  lat_min: 48.5
  lat_max: 60.0
  dlat: 0.066666667     # dlon computed automatically (equidistant=true is the default)
  # dlon: 0.05          # uncomment + add equidistant: false for an explicit equal-degree grid
  rotation: 0.0     # degrees CCW; non-zero produces a rotated curvilinear grid
  # interfaces: false  # true → lon/lat bounds are cell corners; false (default) → T-points

regridding:
  cache_dir: ./regrid_weights
  min_depth: 2.0            # minimum depth for wet cells (m)
  min_wet_fraction: 0.4     # cells below this ocean fraction → forced to land
  coastline_mask: "10m"     # overlay NE land polygons on source; "10m" | "50m" | "110m"
  # tile_cells: 0           # tiled regridding tile size (0 = single pass)
  # tile_buf_deg: 0.5       # overlap buffer between tiles (degrees)
  # pad_deg: 1.0            # extra source margin beyond grid extent (expert)

analysis:
  nkeep_basins: 1              # keep only the largest connected ocean basin
  # keep_basins: [1]           # select specific basins by size-rank (overrides nkeep_basins)
  phantom_island_max_wet_fraction: 0.5   # candidate if wet_fraction below this
  phantom_island_search_radius: 2        # exclude candidates within this many cells of coarse land
  phantom_island_max_cluster_size: 1     # max cluster size to flag (auto-raised to 5 when fine src available)
  wet_frac_threshold: 0.3      # inspect interfaces where wet_frac < this
  sill_ratio_threshold: 0.7    # flag if sill_depth_fine / sill_depth_coarse < this
  area_ratio_threshold: 0.5    # flag if section_area_fine / section_area_coarse < this
  # max_section_profiles: 10   # max cross-section plots in the report

smooth:
  rx0: 0.2    # target Haney slope factor; set to null or remove to skip smoothing

output:
  # file and report_dir are derived from 'name' above when not set:
  #   file       → northsea_1d15deg.nc
  #   report_dir → ./report/northsea_1d15deg/
  # log_depth_scale: true
  # coastline_scale: "10m"   # NaturalEarth: "10m" | "50m" | "110m"; or GSHHG: "gshhg-f" | "gshhg-h" | "gshhg-i" | "gshhg-l" | "gshhg-c"

# Fixes: re-run with --accept-fixes to apply all suggestions automatically,
# or paste selected entries here.  Available actions: set_depth, open_cell, close_cell
# fixes:
#   - lon: 5.3
#     lat: 55.7
#     action: set_depth
#     value: 22.0   # depth in metres

# Explicit mask regions: force wet cells to land after regridding.
# Applied at step 4b — before basin removal and strait detection.
# Supported types: rectangle, polygon, point, ij_rectangle, ij_point.
mask_regions:
#   - type: rectangle
#     lon_min: 9.0
#     lon_max: 10.5
#     lat_min: 54.5
#     lat_max: 55.5
#     name: Kiel Bight
  - type: polygon
    name: North East boundary
    vertices:        # list of [lon, lat] corner pairs
      - [5.204, 59.967]
      - [5.204, 59.9]
  - type: point
    lon: -5.750
    lat: 50.033
    name: Irish Sea
#   # Grid-index variants (i = x/longitude column, j = y/latitude row, as in ncview):
#   - type: ij_rectangle
#     i_min: 10
#     i_max: 20
#     j_min: 5
#     j_max: 15
#     name: Index-based rectangle
#  - type: ij_point
#    i: 71
#    j: 100
#    name: Limfjorden
#
thalweg:
  boundary_thalwegs: false   # set to true to enable boundary auto-detection
  # auto_corridors: true        # auto-detect narrow chokepoints (articulation-point method)
  # auto_corridor_min_basin_cells: 20   # ignore components smaller than this
  # auto_corridor_min_length: 1         # min articulation-point cells per corridor
  # auto_corridor_margin: 3             # bbox padding + begin/end search radius (cells)
  # auto_corridor_merge_dist: 2         # merge corridors within this many cells
  # bbox_depth_percentile: 75  # global fallback: set coarse cells in ALL waypoint bboxes
  #                             # to this fine-grid depth percentile (can deepen or shallow;
  #                             # baked into the raw-regrid cache — delete
  #                             # regrid_weights/{name}_raw_regrid.nc to recompute)
  waypoints:
    - name: "Little Belt"
      begin: [9.75, 55.58]  # northern entrance of the narrow Lillebælt, well inside the belt
      end:   [9.9, 55.1]    # south end of Lillebælt
      via:
        - [9.768, 55.233]   # narrowest section
      bbox: [9.3, 10.2, 55.0, 55.7]
      bbox_depth_percentile: 75  # per-waypoint override (overrides thalweg-level default)
    - name: "Great Belt"
      begin: [11.0, 55.8]   # Kattegat, north of Funen
      end:   [11.0, 54.7]   # Baltic approach, south of Langeland
      bbox:  [10.5, 12.0, 54.5, 56.0]
      bbox_depth_percentile: 75  # per-waypoint override (overrides thalweg-level default)
    - name: "Öresund"
      begin: [12.6, 56.1]   # Kattegat north of strait
      end:   [12.8, 55.65]  # Baltic south of Malmö
      via:
        - [12.65, 56.04]    # Helsingborg/Helsingør narrows
      bbox: [12.4, 13.0, 55.5, 56.2]
      bbox_depth_percentile: 75  # per-waypoint override (overrides thalweg-level default)

# Nudge inner bathymetry near open boundaries toward an outer (coarser) model.
# Cross-sectional area at each boundary face is preserved; a cosine taper blends
# the correction to zero over 'width' cells inland.  Cells that are deepened are
# soft-pinned so Haney smoothing cannot shallow them.
#
# nudge_boundaries:
#   enabled: true                    # set false to keep config but skip the step
#   outer_file: /path/to/outer_model_bathymetry.nc
#   # Specify open boundaries by file OR by sides (or both):
#   boundaries_file: northsea_1d15deg_bdy.csv  # *_bdy.csv from --write-boundaries
#   boundaries: [N, S, E, W]         # fallback: nudge all cells on these grid edges
#   width: 10                        # taper width in cells (default 10)
#   shape: cosine                    # taper shape: cosine | linear | exponential
#   min_depth: 2.0                   # floor for nudged depth (m)
#   max_scale: 3.0                   # clamp scale factor to [1/max_scale, max_scale]
#   outer_depth_var: depth           # variable name in outer file (auto-detected if omitted)
