# SuperGrid example — use an existing MOM6 ocean_hgrid.nc or pyGETM supergrid
# as the target grid definition.
#
# A supergrid file has shape (2·ny+1) × (2·nx+1) and interleaves all four
# Arakawa C-grid staggered positions:
#
#   Row\Col  even         odd
#   even     Q (corner)   V (N/S face)
#   odd      U (E/W face) T (centre)
#
# The pipeline reads the file, extracts T-point centres [1::2, 1::2] and
# Q-point corners [0::2, 0::2] for ESMF conservative regridding.
#
# Output depth_u / depth_v (C-grid face depths) are ALWAYS written alongside
# depth (T-point depths) regardless of grid type.
#
# Run with:
#   bathymetry-regrid --config example_supergrid.yaml

name: my_model_supergrid

source: /server/data/GEBCO/GEBCO_2023.nc

grid:
  type: supergrid
  file: /path/to/ocean_hgrid.nc   # MOM6 style: variables x, y (shape 2ny+1 × 2nx+1)
  # file: /path/to/pygetm_grid.nc # pyGETM: variables lon, lat
  # x_var: x     # default — auto-detected from (x, lon, longitude)
  # y_var: y     # default — auto-detected from (y, lat, latitude)

regridding:
  cache_dir: ./regrid_weights
  min_depth: 2.0            # minimum depth for wet cells (m)
  min_wet_fraction: 0.05    # cells below this ocean fraction → forced to land
  # coastline_mask: "10m"   # overlay NE land polygons on source; "10m" | "50m" | "110m"
  # tile_cells: 0           # tiled regridding tile size (0 = single pass)
  # tile_buf_deg: 0.5       # overlap buffer between tiles (degrees)
  # pad_deg: 1.0            # extra source margin beyond grid extent (expert)

analysis:
  nkeep_basins: 1              # keep only the largest connected ocean basin
  phantom_island_max_wet_fraction: 0.5   # candidate if wet_fraction below this
  phantom_island_max_fine_cells: 1000    # fine-grid component size above which a feature is mainland (not an island)
  phantom_island_search_radius: 2        # coarse-grid neighbourhood check (fallback only, used when --skip-regrid)
  phantom_island_max_cluster_size: 1     # max coarse-cell cluster size to flag (auto-raised to 5 when fine src available)
  wet_frac_threshold: 0.3      # inspect interfaces where wet_frac < this
  sill_ratio_threshold: 0.7    # flag if sill_depth_fine / sill_depth_coarse < this
  area_ratio_threshold: 0.5    # flag if section_area_fine / section_area_coarse < this
  # max_section_profiles: 10   # max cross-section plots in the report

smooth:
  rx0: 0.2

output:
  # file and report_dir are derived from 'name' above when not set:
  #   file       → my_model_supergrid.nc
  #   report_dir → ./report/my_model_supergrid/
  # log_depth_scale: true

thalweg:
  boundary_thalwegs: false   # set to true to enable boundary auto-detection
