# Example configuration for a North Sea bathymetry run.
# Run with: bathymetry-regrid --config example_northsea.yaml
# Override individual settings on the command line, e.g.:
#   bathymetry-regrid --config example_northsea.yaml --smooth-rx0 0.15

# Short identifier used in all output file names:
#   output NetCDF  → northsea_0p05deg.nc
#   report dir     → ./report/northsea_0p05deg/
#   figures        → northsea_0p05deg_02_source_depth.png, etc.
name: skamix_1d100deg

source: /server/data/GEBCO/GEBCO_2023.nc

grid:
  type: spherical
  lon_min: 6.0
  lon_max: 13.0
  lat_min: 56.25
  lat_max: 60.0
  dlon: 0.01
  dlat: 0.01
  # equidistant: true   # omit dlon (keep dlat) to compute dlon = dlat / cos(lat_center)
  #                     # so cells are approximately square in physical distance;
  #                     # this reduces the number of longitude grid points
  rotation: 0.0     # degrees CCW; non-zero produces a rotated curvilinear grid

regridding:
  cache_dir: ./regrid_weights
  min_depth: 2.0            # minimum depth for wet cells (m)
  min_wet_fraction: 0.4     # cells below this ocean fraction → forced to land
  coastline_mask: "10m"     # overlay NE land polygons on source; "10m" | "50m" | "110m"
  # tile_cells: 0           # tiled regridding tile size (0 = single pass)
  # tile_buf_deg: 0.5       # overlap buffer between tiles (degrees)
  # pad_deg: 1.0            # extra source margin beyond grid extent (expert)

analysis:
  nkeep_basins: 1              # keep only the largest connected ocean basin
  wet_frac_threshold: 0.3      # inspect interfaces where wet_frac < this
  sill_ratio_threshold: 0.7    # flag if sill_depth_fine / sill_depth_coarse < this
  area_ratio_threshold: 0.5    # flag if section_area_fine / section_area_coarse < this
  # max_section_profiles: 10   # max cross-section plots in the report

smooth:
  rx0: 0.2    # target Haney slope factor; set to null or remove to skip smoothing

output:
  # file and report_dir are derived from 'name' above when not set:
  #   file       → northsea_1d15deg.nc
  #   report_dir → ./report/northsea_1d15deg/
  log_depth_scale: true

# Fixes: re-run with --accept-fixes to apply all suggestions automatically,
# or paste selected entries here.  Available actions: set_depth, open_cell, close_cell
# fixes:
#   - lon: 5.3
#     lat: 55.7
#     action: set_depth
#     value: 22.0   # depth in metres

# Explicit mask regions: force wet cells to land after regridding.
# Applied at step 4b — before basin removal and strait detection.
# Supported types: rectangle, polygon, point, ij_rectangle, ij_point.
mask_regions:
  - type: ij_point
    i: 118
    j: 46
    name: Limfjorden
  - type: ij_rectangle
    i_min: 250
    i_max: 350
    j_min: 0
    j_max: 15
    name: Southern Kattegat
#   - type: rectangle
#     lon_min: 9.0
#     lon_max: 10.5
#     lat_min: 54.5
#     lat_max: 55.5
#     name: Kiel Bight
#   - type: ij_point
#     i: 15
#     j: 8
#     name: Single cell by index
